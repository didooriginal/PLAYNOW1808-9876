			rel="preload"

			type="font/woff2"
			crossorigin
		/>
		<link
			rel="preload"
			href="/fonts/sora-latin-var.woff2"
			as="font"
			type="font/woff2"
			crossorigin
		/>
		<title>PLAYPLUSNOW — Entretenimento de verdade</title>
	</head>
	<body>
		<!--
			Casca estatica do hero: pinta a primeira tela antes do JS carregar.
			O React limpa este conteudo ao montar em #root (createRoot), entao
			nao ha markup duplicado depois da hidratacao. Mantenha o texto igual
			ao <h1> de src/web/components/landing/hero.tsx.
		-->
		<div id="root">
			<div
				style="min-height:100vh;background:#07070b;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;box-sizing:border-box"
			>
				<h1
					style="margin:0;max-width:16em;text-align:center;font-family:Sora,system-ui,sans-serif;font-weight:800;font-size:clamp(2rem,9vw,3.25rem);line-height:1.05;letter-spacing:-0.02em;color:#fff"
				>
					Chega de pagar caro<br />em <span style="color:#ff1f3d">várias</span> assinaturas.
				</h1>
				<p
					style="margin:24px 0 0;max-width:34em;text-align:center;font-family:Outfit,system-ui,sans-serif;font-size:1rem;line-height:1.6;color:rgba(255,255,255,0.55)"
				>
					Todos os seus streamings favoritos em um só combo, com preço acessível e suporte
					especializado.
				</p>
				<div
					style="margin-top:36px;display:flex;gap:12px;flex-wrap:wrap;justify-content:center"
				>
					<span
						style="display:inline-block;height:48px;width:190px;border-radius:14px;background:linear-gradient(90deg,#ff1f3d,#ff5470);opacity:0.85"
					></span>
					<span
						style="display:inline-block;height:48px;width:190px;border-radius:14px;border:1px solid rgba(34,211,238,0.5)"
					></span>
				</div>
			</div>
		</div>
		<script type="module" src="/src/web/main.tsx"></script>
	</body>
</html>
